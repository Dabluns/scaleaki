name: Auto Deploy (frontend Vercel + backend Oracle)

# 100% automatico: todo push na main builda e publica o que mudou.
# - frontend/  -> build + deploy prod na Vercel (build roda aqui, nao na VM = sem OOM)
# - backend (src/, prisma/, package.json) -> git pull + build + pm2 restart na Oracle VM
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: autodeploy-main
  cancel-in-progress: false

jobs:
  # Detecta o que mudou pra rodar so o necessario
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -z "$BASE" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DIFF=$(git diff --name-only "$BASE" HEAD)
          echo "$DIFF"
          echo "frontend=$(echo "$DIFF" | grep -qE '^frontend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "backend=$(echo "$DIFF"  | grep -qE '^(src/|prisma/|package\.json|package-lock\.json|tsconfig)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      # rootDirectory=frontend ja esta nas settings do projeto -> rodar da raiz
      - name: Pull Vercel env (prod)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build (prebuilt, roda aqui)
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy prebuilt -> producao
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

  # backend: COMPILA no Actions (VM de 1GB nao aguenta tsc = OOM) e envia dist/ pronto
  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps (sem baixar chrome do puppeteer)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Prisma generate + compilar TypeScript (aqui, com RAM)
        run: npm run build
      - name: Empacotar dist/
        run: tar czf dist.tgz dist
      - name: Enviar dist/ pra VM (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          timeout: 60s
          source: dist.tgz
          target: /home/${{ secrets.ORACLE_USER }}/scaleaki
      - name: Trocar dist + restart na VM (sem npm ci)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          timeout: 60s
          command_timeout: 8m
          script: |
            set -e
            cd ~/scaleaki
            git fetch origin main
            git reset --hard origin/main
            # dist vem PRONTO do Actions -> so substitui o antigo
            rm -rf dist && tar xzf dist.tgz && rm -f dist.tgz
            export PUPPETEER_SKIP_DOWNLOAD=true
            # A VM ja tem node_modules funcional. NUNCA rodar npm ci aqui:
            # ele apaga tudo e recompila sqlite3/puppeteer sob swap (1GB) = trava a VM.
            # So instala deps QUANDO package-lock.json muda de verdade, e protegido.
            LOCK_HASH=$(sha1sum package-lock.json | awk '{print $1}')
            PREV_HASH=$(cat .deps-lock-hash 2>/dev/null || echo "")
            if [ "$LOCK_HASH" != "$PREV_HASH" ]; then
              echo "package-lock mudou -> instalando deps (protegido, sem dev/optional)"
              # nice+timeout pra nao travar a VM; pula chrome e nao roda audit/fund
              timeout 6m nice -n 19 npm install --omit=dev --omit=optional --no-audit --no-fund
              echo "$LOCK_HASH" > .deps-lock-hash
            else
              echo "package-lock inalterado -> pulando install (node_modules ja serve)"
            fi
            # prisma generate e leve e idempotente (precisa do client pro dist rodar)
            nice -n 19 npx prisma generate
            pm2 restart scaleaki-api --update-env
            pm2 save
            echo "backend deploy OK: $(git rev-parse --short HEAD)"
