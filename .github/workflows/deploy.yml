name: Deploy (LEGADO Railway - manual)

# DESATIVADO do push automatico em 2026-06-24.
# Backend agora roda na Oracle VM via .github/workflows/autodeploy.yml.
# Mantido so para disparo manual caso Railway volte a ser usado.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to Railway (Production)
        if: github.ref == 'refs/heads/main'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npx railway up --service=backend-prod --detach
      - name: Deploy to Railway (Staging)
        if: github.ref == 'refs/heads/develop'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npx railway up --service=backend-staging --detach 