name: Scrape Marketplace (diário)

# 6 scrapers R$0: AliExpress + Dropshipping(motor Ali) + SHEIN + TikTok + Mercado Livre + YouTube.
# Gravam em ScaledProduct (ali+dropshipping+shein+ml) e ScaledAd (tiktok+youtube) via Supabase upsert.

on:
  schedule:
    - cron: '30 11 * * *'   # 11:30 UTC = 08:30 BRT (antes do Ad Library às 09:00)
  workflow_dispatch:
    inputs:
      only:
        description: 'Rodar só um scraper (aliexpress|dropshipping|shein|tiktok|mercadolivre|youtube). Vazio = todos.'
        required: false
        default: ''

concurrency:
  group: scrape-marketplace
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ONLY: ${{ github.event.inputs.only }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: AliExpress
        if: ${{ env.ONLY == '' || env.ONLY == 'aliexpress' }}
        continue-on-error: true
        run: node scrapers/aliexpress.js --headless

      - name: Dropshipping (motor Ali, keywords virais BR)
        if: ${{ env.ONLY == '' || env.ONLY == 'dropshipping' }}
        continue-on-error: true
        run: node scrapers/aliexpress.js --headless --source=dropshipping --max-pages=1 --keywords="luminaria astronauta,mini drone,fone bluetooth,massageador,projetor estrelas,organizador,depilador eletrico,suporte celular,camera seguranca,escova alisadora"

      - name: SHEIN (categorias BR)
        if: ${{ env.ONLY == '' || env.ONLY == 'shein' }}
        continue-on-error: true
        run: node scrapers/shein.js --headless

      - name: TikTok Creative Center
        if: ${{ env.ONLY == '' || env.ONLY == 'tiktok' }}
        continue-on-error: true
        run: node scrapers/tiktok.js --periods=7,30,180 --headless

      - name: Mercado Livre
        if: ${{ env.ONLY == '' || env.ONLY == 'mercadolivre' }}
        continue-on-error: true
        run: node scrapers/mercadolivre.js --headless

      - name: YouTube / Google Ads Transparency
        if: ${{ env.ONLY == '' || env.ONLY == 'youtube' }}
        continue-on-error: true
        run: node scrapers/youtube.js --perKeyword=3 --headless
