<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050505;
      color: white;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .logo {
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      font-style: italic;
      margin-bottom: 12px;
    }
    .logo span {
      color: #22c55e;
    }
    p {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #22c55e;
      color: black;
      border: none;
      padding: 12px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #4ade80;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
    }
    .status {
      margin-top: 16px;
      font-size: 11px;
      font-weight: bold;
      padding: 8px;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
    }
    .status.logged-in {
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status.logged-out {
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="logo">scale<span>aki</span> Toolkit</div>
  <p id="main-text">Acesse a Biblioteca de Anúncios do Facebook para utilizar as ferramentas de garimpo.</p>
  
  <a href="https://www.facebook.com/ads/library" target="_blank" class="btn" id="main-btn">Abrir Ad Library</a>

  <div id="auth-status" class="status">Verificando conexão...</div>

  <script src="popup.js"></script>
</body>
</html>
