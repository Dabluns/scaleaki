<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: 'Inter', system-ui, sans-serif; padding: 16px; background: #0A0A0A; color: #E5E5E5; margin: 0; }
    h2 { margin: 0 0 16px 0; font-size: 18px; text-align: center; color: #22C55E; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    label { font-size: 11px; font-weight: bold; color: #A3A3A3; margin-bottom: 4px; display: block; text-transform: uppercase; }
    input { width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; background: #171717; border: 1px solid #333; color: white; border-radius: 8px; font-size: 12px; }
    input:focus { outline: none; border-color: #22C55E; }
    button { width: 100%; padding: 12px; background: #22C55E; color: black; border: none; border-radius: 8px; cursor: pointer; font-weight: 900; font-size: 13px; text-transform: uppercase; transition: all 0.2s; }
    button:hover { background: #16A34A; transform: translateY(-1px); }
    button.mining { background: #EF4444; color: white; }
    button.mining:hover { background: #DC2626; }
    .status { margin-top: 12px; font-size: 11px; text-align: center; color: #737373; font-weight: 600; }
    .status.active { color: #22C55E; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <h2>Scaleaki Miner</h2>
  
  <label>URL da API:</label>
  <input type="text" id="apiUrl" value="https://scaleaki-backend.onrender.com" placeholder="URL do Backend">
  
  <label>Token de Acesso (Scaleaki):</label>
  <input type="password" id="token" placeholder="Cole o JWT de admin aqui">
  
  <button id="toggleBtn">Iniciar Mineração</button>
  <div class="status" id="status">Aguardando início...</div>

  <script src="popup.js"></script>
</body>
</html>
